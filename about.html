<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>소개</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/print.css">
</head>
<body data-page="about" class="paper">
  <main class="about under-header">
    <canvas class="about-deco a" data-shape="arch" aria-hidden="true"></canvas>
    <canvas class="about-deco b" data-shape="sphere" aria-hidden="true"></canvas>
    <canvas class="about-deco c" data-shape="vase" aria-hidden="true"></canvas>
    <canvas class="about-deco d" data-shape="vase" aria-hidden="true"></canvas>
    <canvas class="about-deco e" data-shape="drum" aria-hidden="true"></canvas>
    <canvas class="about-deco f" data-shape="sphere" aria-hidden="true"></canvas>

    <div class="about-inner">
      <p class="about-label">소개</p>
      <h1>원고가 책이 되는<br>모든 과정을<br>함께합니다</h1>
      <div class="ph" role="img" aria-label="작업실 사진"></div>
      <div class="about-text">
        <p>스튜디오 소개가 들어갈 자리입니다. 어떤 책을 만들어 왔는지, 어떤 방식으로 작업하는지 두세 문장으로 적어 주세요.</p>
        <p>표지 디자인부터 내지 편집, 소량 인쇄까지 정해진 가격과 일정으로 진행합니다. 궁금한 점은 고객센터로 문의해 주세요.</p>
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/print.js"></script>
</body>
</html>
